<div *transloco="let t" class="shell" [class.shell--menu-open]="menuOpen()">
  <aside class="shell__aside">
    <div class="shell__brand">
      <app-brand />
      <button
        tuiIconButton
        appearance="flat"
        size="s"
        type="button"
        iconStart="@tui.x"
        class="shell__close"
        [attr.aria-label]="t('common.nav.closeMenu')"
        (click)="menuOpen.set(false)"
      >
        {{ t('common.nav.closeMenu') }}
      </button>
    </div>

    <a
      tuiButton
      size="m"
      iconStart="@tui.plus"
      class="shell__cta"
      [routerLink]="routes.newPix"
      (click)="menuOpen.set(false)"
    >
      {{ t('common.nav.newPix') }}
    </a>

    <nav class="shell__nav" [attr.aria-label]="t('common.nav.main')">
      @for (item of navItems; track item.path) {
        <a
          class="shell__link"
          routerLinkActive="shell__link--active"
          ariaCurrentWhenActive="page"
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="menuOpen.set(false)"
        >
          <tui-icon [icon]="item.icon" />
          <span>{{ t(item.labelKey) }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="shell__user"
      tuiDropdownDirection="top"
      [attr.aria-label]="t('common.nav.userMenu')"
      [tuiDropdown]="userMenu"
      [(tuiDropdownOpen)]="userMenuOpen"
    >
      <span tuiAvatar size="s" class="shell__avatar">{{ initial(auth.profile()?.name) }}</span>
      <span class="shell__user-text">
        <span class="shell__user-name">{{ auth.profile()?.name }}</span>
        <span class="shell__user-email">{{ auth.profile()?.email }}</span>
      </span>
      <tui-icon icon="@tui.chevrons-up-down" class="shell__user-chevron" />
    </button>

    <ng-template #userMenu>
      <tui-data-list>
        <a tuiOption [routerLink]="routes.profile" (click)="closeMenus()">
          <tui-icon icon="@tui.user" />
          {{ t('common.nav.profile') }}
        </a>
        <a tuiOption [routerLink]="routes.changePassword" (click)="closeMenus()">
          <tui-icon icon="@tui.key-round" />
          {{ t('common.actions.changePassword') }}
        </a>
        <button tuiOption type="button" (click)="logout()">
          <tui-icon icon="@tui.log-out" />
          {{ t('common.actions.logout') }}
        </button>
      </tui-data-list>
    </ng-template>
  </aside>

  <button
    type="button"
    class="shell__backdrop"
    tabindex="-1"
    [attr.aria-label]="t('common.nav.closeMenu')"
    (click)="menuOpen.set(false)"
  ></button>

  <div class="shell__main">
    <header class="shell__bar">
      <button
        tuiIconButton
        appearance="flat"
        type="button"
        iconStart="@tui.menu"
        [attr.aria-label]="t('common.nav.openMenu')"
        (click)="menuOpen.set(true)"
      >
        {{ t('common.nav.openMenu') }}
      </button>
      <app-brand />
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
